name: EFI Web RC2 Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run build
      - run: node --check efi-intelligence/analyzer.mjs
      - run: node --check efi-intelligence/importer.mjs
      - run: node --check efi-intelligence/app.mjs